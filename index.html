<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" name="viewport" />
  <title>AI-103: Azure AI Apps and Agents Developer Associate — Studio</title>

  <!-- Google Fonts: Geist & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Geist", "-apple-system", "BlinkMacSystemFont", "Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#f8fafc] dark:bg-[#0a0e17] text-[#0f172a] dark:text-[#e2e8f0] font-sans antialiased min-h-screen flex flex-col selection:bg-sky-500/20 selection:text-sky-400 transition-colors duration-200 pb-28">

  <!-- TOP APP BAR (Compact & Safe Area Aware) -->
  <header class="sticky top-0 z-40 w-full bg-white/85 dark:bg-[#0a0e17]/85 backdrop-blur-xl border-b border-black/[0.06] dark:border-white/[0.08] transition-colors pt-[env(safe-area-inset-top,0px)]">
    <div class="max-w-3xl mx-auto px-3 sm:px-6 h-12 flex items-center justify-between">
      
      <!-- Left: Monogram Badge & Mode Switcher -->
      <div class="flex items-center space-x-2">
        <span class="px-2 py-0.5 rounded text-[11px] font-mono font-semibold bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20">
          AI-103
        </span>
        <div class="flex items-center p-0.5 bg-black/[0.04] dark:bg-white/[0.06] rounded-lg text-xs font-medium">
          <button id="btnStudyMode" class="zen-mode-btn active px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-md transition-all text-xs">
            Ôn tập
          </button>
          <button id="btnExamMode" class="zen-mode-btn px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-md text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all text-xs">
            Thi thử
          </button>
        </div>
      </div>

      <!-- Right: Actions (Timer, Grid drawer [G], Theme) -->
      <div class="flex items-center space-x-1.5">
        <!-- Live Exam Timer -->
        <div id="examTimer" class="hidden items-center space-x-1 px-2 py-0.5 rounded bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20 font-mono text-[11px]">
          <span class="material-symbols-outlined text-[13px]">schedule</span>
          <span id="timerText">00:00</span>
        </div>

        <!-- Matrix Drawer Button -->
        <button id="toggleDrawerBtn" class="flex items-center space-x-1 px-2.5 py-1 rounded-lg bg-black/[0.03] dark:bg-white/[0.06] hover:bg-black/[0.06] dark:hover:bg-white/[0.1] border border-black/[0.06] dark:border-white/[0.08] text-xs font-medium active:scale-95">
          <span class="material-symbols-outlined text-[15px] text-sky-500">grid_view</span>
          <span id="drawerTriggerCount" class="font-mono text-[11px]">175 câu</span>
        </button>

        <!-- Theme Toggle -->
        <button id="btnThemeToggle" class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-black/[0.04] dark:hover:bg-white/[0.06] transition-all active:scale-95" title="Chế độ Sáng / Tối">
          <span id="themeIconSun" class="material-symbols-outlined text-[18px]">light_mode</span>
          <span id="themeIconMoon" class="material-symbols-outlined text-[18px] hidden">dark_mode</span>
        </button>
      </div>

    </div>

    <!-- 2px Precision Progress Indicator -->
    <div class="w-full h-[2px] bg-black/[0.04] dark:bg-white/[0.04] relative overflow-hidden">
      <div id="progressBarFill" class="h-full bg-gradient-to-r from-sky-500 via-cyan-400 to-emerald-400 transition-all duration-300 shadow-[0_0_8px_rgba(56,189,248,0.6)]" style="width: 0%;"></div>
    </div>
  </header>

  <!-- MAIN CANVAS (Centered, Distraction-Free & Ergonomic) -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-3.5 sm:px-6 pt-4 sm:pt-6 pb-28">
    
    <!-- Meta Info Bar -->
    <div class="flex items-center justify-between pb-3 border-b border-black/[0.06] dark:border-white/[0.08] mb-4">
      <div class="flex items-center space-x-1.5 sm:space-x-2">
        <span id="qNumber" class="text-[11px] sm:text-xs font-mono font-semibold text-sky-600 dark:text-sky-400 bg-sky-500/10 px-2 sm:px-2.5 py-0.5 rounded-full border border-sky-500/20">
          Câu 1 / 175
        </span>
        <span id="qTypeBadge" class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 bg-black/[0.03] dark:bg-white/[0.06] px-2 sm:px-2.5 py-0.5 rounded-full font-medium border border-black/[0.04] dark:border-white/[0.06]">
          Trắc nghiệm đơn
        </span>
      </div>

      <!-- Bookmark Action -->
      <button id="btnBookmark" class="flex items-center space-x-1 text-xs text-slate-500 dark:text-slate-400 hover:text-amber-500 transition-colors font-medium active:scale-95">
        <span class="material-symbols-outlined text-[17px]">bookmark_border</span>
        <span id="bookmarkText">Lưu [B]</span>
      </button>
    </div>

    <!-- Question Prompt -->
    <article class="mb-5">
      <h1 id="questionText" class="text-[16px] sm:text-[18px] font-medium leading-[1.65] sm:leading-[1.75] text-slate-900 dark:text-slate-100 tracking-[-0.01em] whitespace-pre-line">
        Đang tải nội dung câu hỏi...
      </h1>
    </article>

    <!-- Attached Diagrams / Code Screenshots (Zero-CLS container) -->
    <div id="questionImages" class="flex flex-col gap-3 mb-5" style="display: none;">
      <!-- Dynamic images injected -->
    </div>

    <!-- Options Container -->
    <div id="optionsContainer" class="space-y-2.5 sm:space-y-3 mb-6">
      <!-- Options injected dynamically -->
    </div>

    <!-- Exam Submit Button (Visible only in Exam mode) -->
    <div id="examSubmitContainer" class="flex justify-end mb-6" style="display: none;">
      <button id="btnExamSubmit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-medium text-xs shadow-sm transition-all active:scale-95">
        Nộp bài thi & Chấm điểm
      </button>
    </div>

    <!-- Deep Dive / Explanation Card (Minimalist Linear disclosure) -->
    <section id="explanationBox" class="rounded-xl border border-emerald-500/30 bg-emerald-500/[0.05] dark:bg-emerald-500/[0.08] p-4 sm:p-5 space-y-3 transition-all" style="display: none;">
      <div class="flex items-center justify-between pb-2.5 border-b border-emerald-500/20">
        <div class="flex items-center space-x-2">
          <span class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-[14px]">check</span>
          </span>
          <span id="explCorrectAnswer" class="font-semibold text-xs sm:text-sm text-emerald-700 dark:text-emerald-400">
            Đáp án chính xác
          </span>
        </div>
        <span class="text-[10px] sm:text-[11px] font-mono text-slate-400">Microsoft Learn</span>
      </div>

      <div id="explBody" class="text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-[1.7] whitespace-pre-line font-sans">
      </div>
    </section>

  </main>

  <!-- FLOATING THUMB-FRIENDLY NAV CAPSULE (Mobile Optimized) -->
  <div class="fixed bottom-0 inset-x-0 z-30 flex justify-center items-center px-4 pb-[calc(env(safe-area-inset-bottom,0px)+0.75rem)] pt-2 pointer-events-none">
    <nav aria-label="Điều hướng câu hỏi" class="pointer-events-auto rounded-full bg-white/95 dark:bg-[#111726]/95 backdrop-blur-xl border border-black/[0.08] dark:border-white/[0.1] shadow-xl shadow-black/10 dark:shadow-black/40 flex items-center justify-between px-2 py-1.5 w-full max-w-[340px] sm:max-w-sm">
      
      <!-- Previous -->
      <button id="btnPrev" class="flex items-center justify-center w-10 h-10 rounded-full text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-black/[0.04] dark:hover:bg-white/[0.08] active:scale-90 transition-all disabled:opacity-30 disabled:cursor-not-allowed" title="Câu trước [←]">
        <span class="material-symbols-outlined text-[22px]">chevron_left</span>
      </button>

      <!-- Center indicator (Quick matrix trigger) -->
      <button id="btnNavMatrix" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-sky-500/10 hover:bg-sky-500/15 text-sky-600 dark:text-sky-400 border border-sky-500/20 active:scale-95 transition-all text-xs font-mono font-semibold" title="Mở danh sách câu hỏi [G]">
        <span class="material-symbols-outlined text-[14px]">grid_view</span>
        <span id="navStatus">1 / 175</span>
      </button>

      <!-- Explanation Toggle (Space) -->
      <button id="btnToggleExplanation" class="flex items-center justify-center w-10 h-10 rounded-full text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-black/[0.04] dark:hover:bg-white/[0.08] active:scale-90 transition-all" title="Giải thích [Space]">
        <span class="material-symbols-outlined text-[19px]">lightbulb</span>
      </button>

      <!-- Next -->
      <button id="btnNext" class="flex items-center justify-center w-10 h-10 rounded-full bg-sky-500 hover:bg-sky-400 text-white shadow-xs active:scale-90 transition-all disabled:opacity-40 disabled:cursor-not-allowed" title="Câu tiếp theo [→]">
        <span class="material-symbols-outlined text-[22px]">chevron_right</span>
      </button>

    </nav>
  </div>

  <!-- QUESTION MATRIX DRAWER (Bottom Sheet on Mobile, Slide-over on Desktop) -->
  <div id="drawerOverlay" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 transition-opacity opacity-0 pointer-events-none"></div>

  <aside id="questionDrawer" class="fixed z-50 bg-white dark:bg-[#0e1422] border-black/[0.08] dark:border-white/[0.08] shadow-2xl flex flex-col justify-between transition-transform duration-300 ease-in-out
    /* Mobile: Bottom Sheet */
    bottom-0 inset-x-0 rounded-t-2xl border-t max-h-[82vh] translate-y-full
    /* Desktop: Right Slide-Over */
    sm:bottom-auto sm:top-0 sm:right-0 sm:inset-x-auto sm:h-full sm:w-full sm:max-w-sm sm:rounded-t-none sm:border-t-0 sm:border-l sm:max-h-full sm:translate-y-0 sm:translate-x-full">
    
    <!-- Drawer Header & Filters -->
    <div class="p-4 border-b border-black/[0.06] dark:border-white/[0.08] space-y-3">
      <!-- Mobile Pull Bar Handle -->
      <div class="w-10 h-1 bg-black/15 dark:bg-white/20 rounded-full mx-auto sm:hidden mb-1"></div>

      <div class="flex items-center justify-between">
        <span class="font-semibold text-sm text-slate-900 dark:text-slate-100">Danh sách 175 câu hỏi</span>
        <button id="closeDrawerBtn" class="w-7 h-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-black/[0.04] dark:hover:bg-white/[0.06] transition-colors" title="Đóng [ESC]">
          <span class="material-symbols-outlined text-[18px]">close</span>
        </button>
      </div>

      <!-- Quick Search Bar -->
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-2 text-[16px] text-slate-400">search</span>
        <input id="gridSearchInput" class="w-full pl-8 pr-3 py-1.5 bg-black/[0.03] dark:bg-white/[0.06] border border-black/[0.06] dark:border-white/[0.08] rounded-lg text-xs font-sans text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-500 transition-all" placeholder="Tìm kiếm từ khóa (Foundry, Search, Code...)" type="text" />
      </div>

      <!-- Filter Pills (Compact inside drawer) -->
      <div class="flex items-center space-x-1 overflow-x-auto no-scrollbar pt-1">
        <button class="zen-filter-pill active px-2.5 py-1 rounded-md text-[11px] font-medium transition-all" data-filter="all">
          <span>Tất cả</span>
          <span id="countAll" class="opacity-70 font-mono text-[10px]">175</span>
        </button>
        <button class="zen-filter-pill px-2.5 py-1 rounded-md text-[11px] font-medium transition-all" data-filter="unanswered">
          <span>Chưa làm</span>
          <span id="countUnanswered" class="opacity-70 font-mono text-[10px]">175</span>
        </button>
        <button class="zen-filter-pill px-2.5 py-1 rounded-md text-[11px] font-medium transition-all" data-filter="wrong">
          <span>Sai</span>
          <span id="countWrong" class="text-rose-500 font-mono text-[10px]">0</span>
        </button>
        <button class="zen-filter-pill px-2.5 py-1 rounded-md text-[11px] font-medium transition-all" data-filter="correct">
          <span>Đúng</span>
          <span id="countCorrect" class="text-emerald-500 font-mono text-[10px]">0</span>
        </button>
        <button class="zen-filter-pill px-2.5 py-1 rounded-md text-[11px] font-medium transition-all" data-filter="bookmarked">
          <span class="text-amber-400">★</span>
          <span id="countBookmarked" class="opacity-70 font-mono text-[10px]">0</span>
        </button>
      </div>

      <!-- Progress summary in drawer -->
      <div class="flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400 font-mono pt-1">
        <span id="progressLabel">0 / 175 câu (0%)</span>
        <div class="flex items-center space-x-2">
          <span class="flex items-center space-x-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>Đúng</span></span>
          <span class="flex items-center space-x-1"><span class="w-2 h-2 rounded-full bg-rose-500"></span><span>Sai</span></span>
        </div>
      </div>
    </div>

    <!-- Matrix Grid Tiles -->
    <div id="gridContainer" class="flex-1 overflow-y-auto p-4 grid grid-cols-5 gap-2 font-mono text-xs no-scrollbar">
      <!-- Injected dynamically -->
    </div>

    <!-- Drawer Footer -->
    <div class="p-4 border-t border-black/[0.06] dark:border-white/[0.08] pb-[calc(env(safe-area-inset-bottom,0px)+1rem)]">
      <button id="btnResetAllProgress" class="w-full py-2 rounded-lg text-xs font-semibold text-rose-500 bg-rose-500/10 hover:bg-rose-500/15 transition-all">
        Đặt lại toàn bộ tiến độ
      </button>
    </div>

  </aside>

  <!-- LIGHTBOX MODAL FOR IMAGES -->
  <div id="lightboxModal" class="lightbox-overlay" style="display: none;">
    <div class="lightbox-content">
      <button id="btnCloseLightbox" class="lightbox-close">&times;</button>
      <img id="lightboxImg" src="" alt="Hình ảnh phóng to" />
    </div>
  </div>

  <!-- EXAM RESULT MODAL -->
  <div id="examResultModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Kết quả bài thi thử</h2>
        <button id="btnCloseExamResult" class="close-btn">&times;</button>
      </div>
      <div class="result-content">
        <div class="score-circle">
          <span id="resultScorePercent" class="score-num">0%</span>
          <span id="resultPassStatus" class="score-label">Chưa đạt</span>
        </div>
        <div class="result-breakdown">
          <div class="res-item">
            <span>Tổng số câu:</span>
            <span id="resTotal">175</span>
          </div>
          <div class="res-item text-emerald-500">
            <span>Số câu đúng:</span>
            <span id="resCorrect">0</span>
          </div>
          <div class="res-item text-rose-500">
            <span>Số câu sai:</span>
            <span id="resWrong">0</span>
          </div>
          <div class="res-item text-slate-400">
            <span>Chưa trả lời:</span>
            <span id="resSkipped">0</span>
          </div>
          <div class="res-item">
            <span>Thời gian hoàn thành:</span>
            <span id="resTime">00:00</span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnReviewWrong" class="btn-outline">Xem lại câu sai</button>
        <button id="btnRestartExam" class="btn-primary">Làm lại bài thi</button>
      </div>
    </div>
  </div>

  <!-- Data & Scripts -->
  <script src="data/questions-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
