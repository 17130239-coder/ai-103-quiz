<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fff7ed" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7c2d12" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- iOS 18 Squircle background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#brandGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- AI Sparkles Glyph & Neural Node -->
  <g filter="url(#softGlow)" fill="url(#starGrad)">
    <!-- Primary Sparkle -->
    <path d="M 52 30 Q 52 66 88 66 Q 52 66 52 102 Q 52 66 16 66 Q 52 66 52 30 Z" />
    
    <!-- Secondary Sparkle (top-right) -->
    <path d="M 94 18 Q 94 34 110 34 Q 94 34 94 50 Q 94 34 78 34 Q 94 34 94 18 Z" />
    
    <!-- Satellite Neural Node (bottom-right) -->
    <circle cx="96" cy="86" r="4.5" />
  </g>
</svg>
